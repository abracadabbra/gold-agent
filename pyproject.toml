[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gold-agent"
version = "0.1.0"
description = "量化 + LLM 混合驱动的黄金价格分析 Agent"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
    
    # 数据采集
    "akshare>=1.15.0",
    "yfinance>=0.2.50",
    "fredapi>=0.5.2",
    
    # 数据处理
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pyarrow>=18.0.0",        # Parquet 读写
    
    # 技术指标
    "pandas-ta>=0.4.0",
    
    # 时序预测
    "prophet>=1.1.6",
    
    # 回测
    "backtrader>=1.9.78",
    
    # LLM
    "openai>=1.60.0",
    "httpx>=0.28.0",
    
    # 数据库
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    
    # 缓存
    "redis>=5.2.0",
    
    # 工具
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.3",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
extras = [
    "cot-reports",
    "cme-fedwatch",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gold_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
per-file-ignores = {"src/*" = ["E402", "I001"]}

[tool.mypy]
python_version = "3.12"
strict = false
check_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src/gold_agent"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "yfinance",
    "fredapi",
    "prophet",
    "backtrader",
    "cot_reports",
    "cme_fedwatch",
    "redis",
    "openai",
    "pandas_ta",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "gold_agent.db.models"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
